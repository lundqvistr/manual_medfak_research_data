name: Publicera Quarto

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Lura Quarto att köra utan R-miljö
        run: |
          # Vi kopierar din .qmd-fil till en .md-fil på servern innan vi renderar.
          # Detta gör att Quarto struntar i att leta efter R/Knitr helt och hållet.
          for f in *.qmd; do
            if [ -f "$f" ]; then
              cp "$f" "${f%.qmd}.md"
            fi
          done
          
          # Bygg projektet utifrån din layout i _quarto.yml
          quarto render

      - name: Publicera till GitHub Pages via gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
