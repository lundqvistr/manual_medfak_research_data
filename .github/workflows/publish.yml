name: Publicera Quarto

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Bygg dokumentet som ren text
        run: |
          quarto render --engine markdown

      - name: Publicera till GitHub Pages via gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site # Om din _quarto.yml sparar på annat ställe (t.ex. docs), ändra här!
          publish_branch: gh-pages
