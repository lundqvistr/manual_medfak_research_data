name: Publicera dokument

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Förbered webbmapp
        run: |
          mkdir -p _site
          # Vi kopierar din fil och sparar den som index.md istället för .html
          # Detta gör att GitHubs inbyggda motor fattar att det är text som ska formateras
          cp *.qmd _site/index.md 2>/dev/null || cp *.md _site/index.md 2>/dev/null

      - name: Ladda upp till GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Distribuera hemsida
        uses: actions/deploy-pages@v4
