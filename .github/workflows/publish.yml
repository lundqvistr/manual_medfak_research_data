name: Publicera Quarto

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Dölj QMD och RMD-filer för att stoppa R-motorn
        run: |
          # Vi ändrar filändelsen på BÅDE .qmd och .Rmd till .md på servern
          for f in *.qmd *.Rmd; do
            if [ -f "$f" ]; then
              mv "$f" "${f%.*}.md"
            fi
          done

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Bygg dokumentet
        run: |
          quarto render

      - name: Publicera till GitHub Pages via gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
