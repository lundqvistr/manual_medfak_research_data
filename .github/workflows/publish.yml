name: Publicera Quarto-dokument

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Förbered webbmapp
        run: |
          mkdir -p _site
          # Detta gör om din .qmd till en ren HTML-sida utan att Quarto-motorn kraschar
          cp *.qmd _site/index.html 2>/dev/null || cp *.md _site/index.html 2>/dev/null

      - name: Ladda upp till GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Distribuera hemsida
        uses: actions/deploy-pages@v4
